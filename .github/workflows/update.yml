name: Update Rules

on:
  schedule:
    - cron: '0 3 1 * *'   # 毎月1日 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download EasyList
        run: curl -fsSL --retry 3 https://easylist.to/easylist/easylist.txt -o easylist.txt

      - name: Build converter
        run: swift build -c release

      - name: Convert filters
        run: |
          .build/release/convert < easylist.txt > easylist-content-rules.json
          echo "Conversion completed"

      - name: Validate JSON structure
        run: |
          jq -e 'type == "array" and length > 0' easylist-content-rules.json > /dev/null
          TOTAL=$(jq 'length' easylist-content-rules.json)
          echo "Total rules: $TOTAL"
          if [ "$TOTAL" -lt 1000 ]; then
            echo "::error::Too few rules: $TOTAL (minimum 1000)"
            exit 1
          fi
          echo "TOTAL_RULES=$TOTAL" >> "$GITHUB_ENV"

      - name: Action type distribution
        run: |
          echo "=== Action type distribution ==="
          jq -r 'group_by(.action.type) | map({type: .[0].action.type, count: length}) | .[] | "\(.count)\t\(.type)"' easylist-content-rules.json | sort -rn | tee action-types.txt
          {
            echo "ACTION_TYPES<<EOF"
            cat action-types.txt
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Whitelist action types
        run: |
          # アプリ側と同じ whitelist 検証
          UNKNOWN=$(jq -r '[.[] | .action.type] | unique - ["block", "css-display-none", "ignore-previous-rules"] | .[]' easylist-content-rules.json)
          if [ -n "$UNKNOWN" ]; then
            echo "::error::Unsupported action types found: $UNKNOWN"
            exit 1
          fi
          echo "All action types are in whitelist"

      - name: Generate SHA-256
        run: |
          shasum -a 256 easylist-content-rules.json > easylist-content-rules.json.sha256
          SHA=$(cut -d' ' -f1 easylist-content-rules.json.sha256)
          SIZE=$(wc -c < easylist-content-rules.json | tr -d ' ')
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          echo "FILE_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Sign rules
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          printf '%s' "$SIGNING_KEY" > private.pem
          openssl pkeyutl -sign -rawin \
            -inkey private.pem \
            -in easylist-content-rules.json \
            -out easylist-content-rules.json.sig
          rm -f private.pem
          echo "Signature: $(wc -c < easylist-content-rules.json.sig | tr -d ' ') bytes"

      - name: Determine tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Delete existing release if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Existing release $TAG found, deleting..."
            gh release delete "$TAG" --yes --cleanup-tag
          else
            echo "No existing release for $TAG"
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<EOF
          Compiled: $(date -u -Iseconds)
          Source: https://easylist.to/easylist/easylist.txt
          Converter: AdguardTeam/SafariConverterLib@v2.1.1
          Safari version target: 18

          Total rules: ${TOTAL_RULES}
          File size: ${FILE_SIZE} bytes
          SHA-256: ${SHA256}

          Action type distribution:
          \`\`\`
          ${ACTION_TYPES}
          \`\`\`
          EOF
          )
          gh release create "${{ steps.tag.outputs.tag }}" \
            easylist-content-rules.json \
            easylist-content-rules.json.sha256 \
            easylist-content-rules.json.sig \
            --title "EasyList ${{ steps.tag.outputs.tag }}" \
            --notes "$NOTES"